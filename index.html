<!doctype html>
<html lang="en">
<head>
    <title>Jawbreaker</title>
    <meta charset="UTF-8"/>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Jawbreaker Game, also called Same Game"/>
    <meta
            name="keywords"
            content="jawbreaker, same game, online games, free games"
    />
    <meta name="rating" content="Safe For Kids"/>
    <link rel="icon" href="static/favicon.svg" type="image/svg+xml"/>
    <link rel="stylesheet" href="static/style.css"/>
    <script
            type="module"
            src="static/datastar-1-0-0-beta-11-94aeb8bd6de30ff3.js"
    ></script>
    <script>
        window.gamePieces = "{{pieces}}";
    </script>
</head>
<body>

<h1 class="game-title">Jawbreaker</h1>

<div id="game-container" data-signals="{gameOver:false,currentScore:0,lastScore:{{lastScore}},bestScore:{{bestScore}},pieces:'{{pieces}}'}">
    {{game}}
    <div class="game-over-overlay" id="game-over-overlay" data-class="{'visible': $gameOver}">
        <div class="game-over-content">
            <h2>Game Over!</h2>
            <p>You scored <span data-text="$currentScore">0</span> points</p>
            <button class="new-game-btn" data-on-click="@post('new');">
                New Game
            </button>
        </div>
    </div>
</div>

<div class="game-info" data-on-signal-change-pieces="window.gamePieces=$pieces;">
    <div class="scores-container">
        <div class="score-column">
            <div class="score-type">Current</div>
            <div class="score-value" id="current-score" data-text="$currentScore">0</div>
        </div>
        <div class="score-column">
            <div class="score-type">Last</div>
            <div class="score-value" id="last-score" data-text="$lastScore">0</div>
        </div>
        <div class="score-column">
            <div class="score-type">Best</div>
            <div class="score-value" id="best-score" data-text="$bestScore">0</div>
        </div>
    </div>
</div>
<script src="static/hover.js"></script>
</body>
</html>

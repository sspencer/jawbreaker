<!DOCTYPE html>
<html lang="en">
<head>
    <title>Jawbreaker</title>
    <meta charset="UTF-8"/>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Jawbreaker Game, also called Same Game"/>
    <meta
            name="keywords"
            content="jawbreaker, same game, online games, free games"
    />
    <meta name="rating" content="Safe For Kids"/>
    <link rel="icon" href="static/favicon.svg" type="image/svg+xml"/>
    <link rel="stylesheet" href="static/style.css"/>
    <script
            type="module"
            src="static/datastar-1-0-0-beta-11-94aeb8bd6de30ff3.js"
    ></script>
</head>
<body>
<main aria-label="Game board" data-signals="{gameOver:false,currentScore:0,{{signals}}}">
    {{game}}
    <section class="game-over" role="dialog" aria-label="Game over" data-class="{'visible': $gameOver}">
        <h2>Game Over!</h2>
        <p>You scored <span data-text="$currentScore">0</span> points</p>
        <button data-on-click="@post('new')">New Game</button>
    </section>
</main>
<footer aria-label="Scoreboard">
    <article class="score" role="region" aria-label="Current score">
        <h3>Current</h3>
        <p id="current-score" data-text="$currentScore">0</p>
    </article>
    <article class="score" role="region" aria-label="Last score">
        <h3>Last</h3>
        <p id="last-score" data-text="$lastScore">0</p>
    </article>
    <article class="score" role="region" aria-label="Best score">
        <h3>Best</h3>
        <p id="best-score" data-text="$bestScore">0</p>
    </article>
</footer>
</body>
</html>

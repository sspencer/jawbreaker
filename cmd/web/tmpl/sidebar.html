{{ define "sidebar" }}
<div class="sidebar">
    <div class="score-container">
        <div class="score-box">
            <div class="score-label">Current</div>
            <div id="current-score" class="score-value">0</div>
        </div>
        <div class="score-box">
            <div class="score-label">Last</div>
            <div id="last-score" class="score-value">0</div>
        </div>
        <div class="score-box">
            <div class="score-label">Best</div>
            <div id="best-score" class="score-value">0</div>
        </div>
    </div>
    <button id="restart-btn" class="btn">Restart</button>
    <button id="undo-btn" class="btn">Undo</button>
    <button id="help-btn" class="help-btn">Help</button>
</div>
{{ end }}

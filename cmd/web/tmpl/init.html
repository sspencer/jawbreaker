{{ define "init" }}
<script defer>
    document.addEventListener("DOMContentLoaded", () => {
        const mobile = "ontouchstart" in window || navigator.maxTouchPoints > 0;

        const gameOptions = {
            rows: mobile ? parseInt('{{ .MRows }}') : parseInt('{{ .Rows }}'),
            cols: mobile ? parseInt('{{ .MCols }}') : parseInt('{{ .Cols }}'),
            blockSize: mobile ? parseInt('{{ .MBlock }}') : parseInt('{{ .Block }}'),
            cookieName: "{{ .CookieName }}",
            mobile: mobile,
            weightedFills: true,
        };

        initGame(gameOptions);

        setTimeout(() => {
            const header = document.getElementById('page-header');
            if (header) {
                header.classList.add('fade-out');
            }
        }, 2000);
    });
</script>{{ end }}

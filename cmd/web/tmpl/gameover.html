{{ define "gameover" }}
<section class="game-over-overlay" id="game-over-overlay" {{ if .DS }} data-class="{'visible': $gameOver}" {{ end }}>
    <article class="game-over-content">
        <h2>Game Over!</h2>
        <p>You scored <span {{ if .DS }} data-text="$currentScore" {{ end }}>0</span> points.</p>
        <button class="new-game-btn" {{ if .DS }} data-on-click="@post('new');" {{ end }}>
            New Game
        </button>
    </article>
</section>
{{ end }}

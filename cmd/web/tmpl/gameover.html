{{ define "gameover" }}
<section class="game-over-overlay" id="game-over-overlay">
    <article class="game-over-content">
        <h2>Game Over!</h2>
        <p>You scored
            <span id="game-over-score">0</span>
            points, which includes a bonus of
            <span id="bonus-points">0</span>
            for leaving
            <span id="remaining-pieces">0</span>
            <span id="pieces-name">pieces</span>
            on the board.
        </p>
        <button class="new-game-btn">
            New Game
        </button>
    </article>
</section>
{{ end }}

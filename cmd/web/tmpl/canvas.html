<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Jawbreaker</title>
    <meta charset="UTF-8"/>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Jawbreaker Game, also called Same Game"/>
    <meta name="keywords" content="jawbreaker, same game, online games, free games"/>
    <meta name="rating" content="Safe For Kids"/>
    <link rel="icon" href="static/favicon.ico" type="image/x-icon"/>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: linear-gradient(135deg, #2c3e50, #4a5568);
        padding: 20px;
        min-height: 100vh;
        margin: 0;
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background:
          radial-gradient(circle at 20% 30%, rgba(66, 153, 225, 0.15) 0%, transparent 50%),
          radial-gradient(circle at 80% 70%, rgba(237, 100, 166, 0.15) 0%, transparent 50%);
        z-index: -1;
      }

      .container {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 15px;
        width: 200px;
      }

      .title {
        font-size: 24px;
        font-weight: bold;
        color: white;
        text-align: center;
        margin-bottom: 10px;
        text-shadow: 0 2px 10px rgba(66, 153, 225, 0.5);
      }

      .score-container {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .score-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        border-radius: 10px;
        padding: 15px 10px;
        background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        height: 90px;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .score-label {
        font-weight: bold;
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 14px;
      }

      .score-value {
        font-size: 28px;
        font-weight: bold;
        color: #fff;
        text-shadow: 0 0 10px rgba(66, 153, 225, 0.5);
      }

      .help-btn {
        background: #19a;
        color: white;
        border: none;
        padding: 12px 24px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
      }

      .help-btn:hover {
        transform: translateY(-3px) scale(1.05);
      }

      #game-container {
        background-color: #1a202c;
        border-radius: 12px;
        padding: 12px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }

      #game-canvas {
        display: block;
        border-radius: 4px;
      }

      .game-over-overlay {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 100;
        border-radius: 8px;
        backdrop-filter: blur(5px);
      }

      .game-over-overlay.visible {
        display: flex;
      }

      .game-over-content {
        background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
        padding: 30px;
        border-radius: 10px;
        text-align: center;
        max-width: 80%;
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
      }

      .game-over-content h2 {
        margin-top: 0;
        color: #fff;
        font-size: 28px;
        text-shadow: 0 2px 10px rgba(66, 153, 225, 0.5);
      }

      .game-over-content p {
        font-size: 18px;
        margin: 20px 0;
        color: rgba(255, 255, 255, 0.9);
      }

      .game-over-content p span {
        font-weight: bold;
        color: #4fd1c5;
      }

      .new-game-btn {
        background: #19a;
        color: white;
        border: none;
        padding: 12px 24px;
        font-size: 20px;
        font-weight: bold;
        border-radius: 10px;
        cursor: pointer;
      }

      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0; top: 0;
        width: 100%; height: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(5px);
      }

      .modal-content {
        background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
        margin: 15% auto;
        padding: 30px;
        border-radius: 10px;
        max-width: 600px;
        width: 80%;
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        position: relative;
      }

      .close {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
        position: absolute;
        top: 10px;
        right: 20px;
      }

      .close:hover {
        color: white;
      }

      .modal-content h2 {
        margin-top: 0;
        color: #fff;
        font-size: 24px;
      }

      @media (max-width: 768px) {
        .container {
          flex-direction: column;
          align-items: center;
        }
        .sidebar {
          width: 100%;
          max-width: 400px;
          margin-top: 20px;
          margin-bottom: 0;
          order: 2;
        }
        #game-container {
          order: 1;
        }
        .score-container {
          flex-direction: row;
          flex-wrap: wrap;
          justify-content: center;
        }
        .score-box {
          width: 30%;
          min-width: 100px;
        }
      }
    </style>

  <body>
    <div class="container">
      {{ template "sidebar" . }}

      <div id="game-container">
        <canvas id="game-canvas"></canvas>
        {{ template "gameover" . }}
      </div>
    </div>

    {{ template "help" . }}

    <script>
      function getCookie(name) {
        const cookies = document.cookie.split(";");
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          if (cookie.startsWith(name + "=")) {
            return cookie.substring(name.length + 1);
          }
        }
        return "";
      }

      function setCookie(name, value, days = 365) {
        const date = new Date();
        date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
        const expires = "expires=" + date.toUTCString();
        document.cookie = name + "=" + value + ";" + expires + ";path=breaker";
      }

      class BreakerCanvas {
        static ROWS = {{.Rows}};
        static COLS = {{.Cols}};
        static BLOCK_SIZE = {{.BlockSize}};
        static GAP = 0;
        static BORDER = 0;
        static WHITE = "w";
        static PURPLE = "p";
        static BLUE = "b";
        static GREEN = "g";
        static RED = "r";
        static YELLOW = "y";

        static COLOR_PIECES = [
          BreakerCanvas.PURPLE,
          BreakerCanvas.BLUE,
          BreakerCanvas.GREEN,
          BreakerCanvas.RED,
          BreakerCanvas.YELLOW,
        ];

        static COLOR_MAP = new Map([
          [BreakerCanvas.PURPLE, "#8a2be2"],
          [BreakerCanvas.BLUE, "#00a0ff"],
          [BreakerCanvas.GREEN, "#00cc66"],
          [BreakerCanvas.RED, "#ff3333"],
          [BreakerCanvas.YELLOW, "#ffcc00"],
          [BreakerCanvas.WHITE, "transparent"],
        ]);

        constructor() {
          this.canvas = document.getElementById("game-canvas");
          this.ctx = this.canvas.getContext("2d");

          // Compute canvas size based on constants
          const canvasWidth = BreakerCanvas.COLS * BreakerCanvas.BLOCK_SIZE +
                             (BreakerCanvas.COLS - 1) * BreakerCanvas.GAP + 
                             2 * BreakerCanvas.BORDER;
          const canvasHeight = BreakerCanvas.ROWS * BreakerCanvas.BLOCK_SIZE +
                              (BreakerCanvas.ROWS - 1) * BreakerCanvas.GAP + 
                              2 * BreakerCanvas.BORDER;

          // Set canvas size
          this.canvas.width = canvasWidth;
          this.canvas.height = canvasHeight;

          this.score = 0;
          this.lastScore = 0;
          this.bestScore = 0;
          this.board = this.newBoard();
          this.hoverList = new Set();
          this.hoverIndex = -1;

          const scoresCookie = getCookie("scores");
          if (scoresCookie) {
            const [lastScore, bestScore] = scoresCookie.split("|");
            this.lastScore = parseInt(lastScore, 10) || 0;
            this.bestScore = parseInt(bestScore, 10) || 0;

            document.getElementById("last-score").innerText = this.lastScore;
            document.getElementById("best-score").innerText = this.bestScore;
          }

          this.registerEvents();
          this.renderBoard();
        }

        registerEvents() {
          this.canvas.addEventListener("click", (e) => {
            this.handleClick(e);
          });

          this.canvas.addEventListener("mousemove", (e) => {
            this.handleMouseMove(e);
          });

          this.canvas.addEventListener("mouseleave", () => {
            this.hoverList.clear();
            this.hoverIndex = -1;
            this.renderBoard();
          });

          const newGameBtn = document.querySelector(".new-game-btn");
          if (newGameBtn) {
            newGameBtn.addEventListener("click", (e) => {
              this.resetGame();
              document
                .getElementById("game-over-overlay")
                .classList.remove("visible");
              e.preventDefault();
            });
          }

          // Help button and modal
          const helpBtn = document.getElementById("help-btn");
          const helpModal = document.getElementById("help-modal");
          const closeBtn = document.querySelector(".close");

          helpBtn.addEventListener("click", () => {
            helpModal.style.display = "block";
          });

          closeBtn.addEventListener("click", () => {
            helpModal.style.display = "none";
          });

          window.addEventListener("click", (e) => {
            if (e.target === helpModal) {
              helpModal.style.display = "none";
            }
          });
        }

        resetGame() {
          this.board = this.newBoard();
          this.hoverList.clear();
          this.hoverIndex = -1;
          this.score = 0;
          document.getElementById("current-score").innerText = this.score;
          this.renderBoard();
        }

        newBoard() {
          let board = "";
          for (let i = 0; i < BreakerCanvas.ROWS * BreakerCanvas.COLS; i++) {
            const rnd = Math.floor(Math.random() * BreakerCanvas.COLOR_PIECES.length);
            board += BreakerCanvas.COLOR_PIECES[rnd];
          }
          return board;
        }

        getCanvasCoordinates(e) {
          const rect = this.canvas.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          return { x, y };
        }

        getBoardIndexFromCoordinates(x, y) {
          // Adjust coordinates to account for border
          const adjustedX = x - BreakerCanvas.BORDER;
          const adjustedY = y - BreakerCanvas.BORDER;

          // Calculate column and row
          const col = Math.floor(adjustedX / (BreakerCanvas.BLOCK_SIZE + BreakerCanvas.GAP));
          const row = Math.floor(adjustedY / (BreakerCanvas.BLOCK_SIZE + BreakerCanvas.GAP));

          if (col < 0 || col >= BreakerCanvas.COLS || row < 0 || row >= BreakerCanvas.ROWS) {
            return -1;
          }

          return row * BreakerCanvas.COLS + col;
        }

        handleClick(e) {
          const { x, y } = this.getCanvasCoordinates(e);
          const index = this.getBoardIndexFromCoordinates(x, y);

          if (index >= 0 && index < this.board.length) {
            const status = this.move(index);
            document.getElementById("current-score").innerText = status.score;

            if (status.gameOver) {
              this.lastScore = this.score;
              if (this.score > this.bestScore) {
                this.bestScore = this.score;
              }

              document.getElementById("game-over-score").innerText = this.score;
              document.getElementById("last-score").innerText = this.lastScore;
              document.getElementById("best-score").innerText = this.bestScore;

              setCookie("scores", `${this.lastScore}|${this.bestScore}`);

              document
                .getElementById("game-over-overlay")
                .classList.add("visible");
              return;
            }

            this.hoverList.clear();
            this.hoverIndex = -1;
            const pieces = this.getConnectedPieces(index);
            if (pieces.length > 1) {
              this.hoverIndex = index;
              for (const i of pieces) {
                this.hoverList.add(i);
              }
            }

            this.renderBoard();
          }
        }

        handleMouseMove(e) {
          const { x, y } = this.getCanvasCoordinates(e);
          const index = this.getBoardIndexFromCoordinates(x, y);

          if (index >= 0 && index < this.board.length && index !== this.hoverIndex) {
            this.hoverList.clear();
            this.hoverIndex = index;
            const pieces = this.getConnectedPieces(index);
            if (pieces.length > 1) {
              for (const i of pieces) {
                this.hoverList.add(i);
              }
              this.renderBoard();
            } else if (this.hoverList.size > 0) {
              this.hoverList.clear();
              this.hoverIndex = -1;
              this.renderBoard();
            }
          }
        }

        renderBoard() {
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

          for (let row = 0; row < BreakerCanvas.ROWS; row++) {
            for (let col = 0; col < BreakerCanvas.COLS; col++) {
              const index = row * BreakerCanvas.COLS + col;
              const color = this.board[index];
              const x = BreakerCanvas.BORDER + col * (BreakerCanvas.BLOCK_SIZE + BreakerCanvas.GAP);
              const y = BreakerCanvas.BORDER + row * (BreakerCanvas.BLOCK_SIZE + BreakerCanvas.GAP);

              if (color !== BreakerCanvas.WHITE) {
                this.ctx.save();

                // Create gradient for the piece
                const gradient = this.ctx.createRadialGradient(
                  x + BreakerCanvas.BLOCK_SIZE * 0.3,
                  y + BreakerCanvas.BLOCK_SIZE * 0.3,
                  BreakerCanvas.BLOCK_SIZE * 0.1,
                  x + BreakerCanvas.BLOCK_SIZE * 0.5,
                  y + BreakerCanvas.BLOCK_SIZE * 0.5,
                  BreakerCanvas.BLOCK_SIZE * 0.7
                );

                const baseColor = BreakerCanvas.COLOR_MAP.get(color);
                gradient.addColorStop(0, this.lightenColor(baseColor, 50));
                gradient.addColorStop(1, this.darkenColor(baseColor, 30));

                // Draw the rounded square
                this.ctx.fillStyle = gradient;
                this.ctx.beginPath();
                const cornerRadius = 4; // Slightly rounded corners like in style.css
                const pieceSize = BreakerCanvas.BLOCK_SIZE - 4; // Slightly smaller to match the circle's size
                const pieceX = x + 2; // Center the piece
                const pieceY = y + 2;

                // Draw rounded rectangle path
                this.ctx.moveTo(pieceX + cornerRadius, pieceY);
                this.ctx.lineTo(pieceX + pieceSize - cornerRadius, pieceY);
                this.ctx.arcTo(pieceX + pieceSize, pieceY, pieceX + pieceSize, pieceY + cornerRadius, cornerRadius);
                this.ctx.lineTo(pieceX + pieceSize, pieceY + pieceSize - cornerRadius);
                this.ctx.arcTo(pieceX + pieceSize, pieceY + pieceSize, pieceX + pieceSize - cornerRadius, pieceY + pieceSize, cornerRadius);
                this.ctx.lineTo(pieceX + cornerRadius, pieceY + pieceSize);
                this.ctx.arcTo(pieceX, pieceY + pieceSize, pieceX, pieceY + pieceSize - cornerRadius, cornerRadius);
                this.ctx.lineTo(pieceX, pieceY + cornerRadius);
                this.ctx.arcTo(pieceX, pieceY, pieceX + cornerRadius, pieceY, cornerRadius);
                this.ctx.fill();

                // Add highlight (small rounded rectangle in top-left corner)
                this.ctx.beginPath();
                const highlightSize = BreakerCanvas.BLOCK_SIZE * 0.3;
                const highlightX = pieceX + BreakerCanvas.BLOCK_SIZE * 0.15;
                const highlightY = pieceY + BreakerCanvas.BLOCK_SIZE * 0.15;
                const highlightRadius = 2; // Smaller corner radius for highlight

                // Draw rounded rectangle for highlight
                this.ctx.moveTo(highlightX + highlightRadius, highlightY);
                this.ctx.lineTo(highlightX + highlightSize - highlightRadius, highlightY);
                this.ctx.arcTo(highlightX + highlightSize, highlightY, highlightX + highlightSize, highlightY + highlightRadius, highlightRadius);
                this.ctx.lineTo(highlightX + highlightSize, highlightY + highlightSize - highlightRadius);
                this.ctx.arcTo(highlightX + highlightSize, highlightY + highlightSize, highlightX + highlightSize - highlightRadius, highlightY + highlightSize, highlightRadius);
                this.ctx.lineTo(highlightX + highlightRadius, highlightY + highlightSize);
                this.ctx.arcTo(highlightX, highlightY + highlightSize, highlightX, highlightY + highlightSize - highlightRadius, highlightRadius);
                this.ctx.lineTo(highlightX, highlightY + highlightRadius);
                this.ctx.arcTo(highlightX, highlightY, highlightX + highlightRadius, highlightY, highlightRadius);

                this.ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
                this.ctx.fill();

                // If this piece is in the hover list, add a glow effect
                if (this.hoverList.has(index)) {
                  this.ctx.shadowColor = baseColor;
                  this.ctx.shadowBlur = 15;
                  this.ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
                  this.ctx.lineWidth = 2;

                  // Draw rounded rectangle for hover effect
                  this.ctx.beginPath();
                  const hoverSize = BreakerCanvas.BLOCK_SIZE - 2; // Slightly larger than the piece
                  const hoverX = x + 1;
                  const hoverY = y + 1;

                  // Draw rounded rectangle path for hover effect
                  this.ctx.moveTo(hoverX + cornerRadius, hoverY);
                  this.ctx.lineTo(hoverX + hoverSize - cornerRadius, hoverY);
                  this.ctx.arcTo(hoverX + hoverSize, hoverY, hoverX + hoverSize, hoverY + cornerRadius, cornerRadius);
                  this.ctx.lineTo(hoverX + hoverSize, hoverY + hoverSize - cornerRadius);
                  this.ctx.arcTo(hoverX + hoverSize, hoverY + hoverSize, hoverX + hoverSize - cornerRadius, hoverY + hoverSize, cornerRadius);
                  this.ctx.lineTo(hoverX + cornerRadius, hoverY + hoverSize);
                  this.ctx.arcTo(hoverX, hoverY + hoverSize, hoverX, hoverY + hoverSize - cornerRadius, cornerRadius);
                  this.ctx.lineTo(hoverX, hoverY + cornerRadius);
                  this.ctx.arcTo(hoverX, hoverY, hoverX + cornerRadius, hoverY, cornerRadius);

                  this.ctx.stroke();
                }

                this.ctx.restore();
              }
            }
          }
        }

        lightenColor(color, percent) {
          const num = parseInt(color.replace("#", ""), 16);
          const amt = Math.round(2.55 * percent);
          const R = (num >> 16) + amt;
          const G = (num >> 8 & 0x00FF) + amt;
          const B = (num & 0x0000FF) + amt;

          return "#" + (
            0x1000000 +
            (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
            (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
            (B < 255 ? B < 1 ? 0 : B : 255)
          ).toString(16).slice(1);
        }

        darkenColor(color, percent) {
          const num = parseInt(color.replace("#", ""), 16);
          const amt = Math.round(2.55 * percent);
          const R = (num >> 16) - amt;
          const G = (num >> 8 & 0x00FF) - amt;
          const B = (num & 0x0000FF) - amt;

          return "#" + (
            0x1000000 +
            (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
            (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
            (B < 255 ? B < 1 ? 0 : B : 255)
          ).toString(16).slice(1);
        }

        getConnectedPieces(index) {
          if (index < 0 || index >= this.board.length) {
            return [];
          }

          const target = this.board[index];
          if (target === BreakerCanvas.WHITE) {
            return [];
          }

          const connectedIndices = [];
          const stack = [index];
          const visited = new Array(BreakerCanvas.ROWS * BreakerCanvas.COLS).fill(false);

          while (stack.length > 0) {
            const i = stack.pop();

            if (i < 0 || i >= this.board.length || this.board[i] !== target || visited[i]) {
              continue;
            }

            visited[i] = true;
            connectedIndices.push(i);

            const row = Math.floor(i / BreakerCanvas.COLS);
            const col = i % BreakerCanvas.COLS;

            if (row > 0) stack.push(i - BreakerCanvas.COLS);
            if (row < BreakerCanvas.ROWS - 1) stack.push(i + BreakerCanvas.COLS);
            if (col > 0) stack.push(i - 1);
            if (col < BreakerCanvas.COLS - 1) stack.push(i + 1);
          }

          if (connectedIndices.length < 2) {
            return [];
          }

          return connectedIndices;
        }

        floodFill(index) {
          const connectedPieces = this.getConnectedPieces(index);
          if (connectedPieces.length < 2) {
            return 0;
          }

          const boardArray = this.board.split("");

          for (const i of connectedPieces) {
            boardArray[i] = BreakerCanvas.WHITE;
          }

          this.board = boardArray.join("");
          return connectedPieces.length;
        }

        applyGravityAndShiftRight() {
          let boardArray = [];
          for (let row = 0; row < BreakerCanvas.ROWS; row++) {
            const rowArray = [];
            for (let col = 0; col < BreakerCanvas.COLS; col++) {
              rowArray.push(this.board[row * BreakerCanvas.COLS + col]);
            }
            boardArray.push(rowArray);
          }

          // Apply gravity (pieces fall down)
          for (let col = 0; col < BreakerCanvas.COLS; col++) {
            let writeRow = BreakerCanvas.ROWS - 1;
            for (let row = BreakerCanvas.ROWS - 1; row >= 0; row--) {
              if (boardArray[row][col] !== BreakerCanvas.WHITE) {
                boardArray[writeRow][col] = boardArray[row][col];
                if (writeRow !== row) {
                  boardArray[row][col] = BreakerCanvas.WHITE;
                }
                writeRow--;
              }
            }
          }

          // Shift columns to the right
          let writeCol = BreakerCanvas.COLS - 1;
          for (let col = BreakerCanvas.COLS - 1; col >= 0; col--) {
            let isEmpty = true;
            for (let row = 0; row < BreakerCanvas.ROWS; row++) {
              if (boardArray[row][col] !== BreakerCanvas.WHITE) {
                isEmpty = false;
                break;
              }
            }

            if (!isEmpty) {
              if (writeCol !== col) {
                for (let row = 0; row < BreakerCanvas.ROWS; row++) {
                  boardArray[row][writeCol] = boardArray[row][col];
                  boardArray[row][col] = BreakerCanvas.WHITE;
                }
              }
              writeCol--;
            }
          }

          let newBoard = "";
          for (let row = 0; row < BreakerCanvas.ROWS; row++) {
            for (let col = 0; col < BreakerCanvas.COLS; col++) {
              newBoard += boardArray[row][col];
            }
          }
          this.board = newBoard;
        }

        move(index) {
          const n = this.floodFill(index);
          if (n < 2) {
            return {
              board: this.board,
              score: this.score,
              gameOver: this.isGameOver(),
            };
          }

          this.applyGravityAndShiftRight();
          this.score += this.calculateMoveScore(n);
          const gameOver = this.isGameOver();

          if (gameOver) {
            let remainingPieces = 0;
            for (let i = 0; i < this.board.length; i++) {
              if (this.board[i] !== BreakerCanvas.WHITE) {
                remainingPieces++;
              }
            }
            this.score += this.calculateRemainingPiecesScore(remainingPieces);
          }

          return {
            board: this.board,
            score: this.score,
            gameOver: gameOver,
          };
        }

        isGameOver() {
          for (let i = 0; i < this.board.length; i++) {
            if (this.board[i] === BreakerCanvas.WHITE) {
              continue;
            }
            if (this.getConnectedPieces(i).length > 1) {
              return false;
            }
          }
          return true;
        }

        calculateMoveScore(piecesRemoved) {
          if (piecesRemoved < 2) {
            return 0;
          }
          return piecesRemoved * (piecesRemoved - 1);
        }

        calculateRemainingPiecesScore(remainingPieces) {
          const threshold = 20;
          if (remainingPieces <= threshold) {
            const p = threshold - remainingPieces;
            return p * p;
          }
          return 0;
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        new BreakerCanvas();
      });
    </script>
  </body>
</html>

{{ define "index" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Jawbreaker</title>
    <meta charset="UTF-8"/>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Jawbreaker Game, also called Same Game"/>
    <meta name="keywords" content="jawbreaker, same game, online games, free games"/>
    <meta name="rating" content="Safe For Kids"/>
    <link rel="icon" href="static/favicon.ico" type="image/x-icon"/>
    <link rel="stylesheet" href="{{.StyleCSS}}"/>
</head>
<body>

<header id="page-header" class="page-header">
    <h1>Jawbreaker</h1>
</header>

<div class="container">
    {{ template "sidebar" . }}

    <main id="game-container">
        <canvas id="game-canvas"></canvas>
        {{ template "gameover" . }}
    </main>
</div>

{{ template "help" . }}

<script src="{{.GameSrc}}" defer></script>
<script defer>
    window.addEventListener('DOMContentLoaded', () => {
        function isMobileDevice() {
            const isTouchCapable = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            const isSmallScreen = window.matchMedia('(max-width: 768px)').matches;
            return isTouchCapable && isSmallScreen;
        }

        const rows = isMobileDevice() ? parseInt('{{ .MRows }}') : parseInt('{{ .Rows }}');
        const cols = isMobileDevice() ? parseInt('{{ .MCols }}') : parseInt('{{ .Cols }}');
        const block = isMobileDevice() ? parseInt('{{ .MBlock }}') : parseInt('{{ .Block }}');
        const opts = {
            rows: rows,
            cols: cols,
            blockSize: block,
            cookieName: '{{ .CookieName }}',
            mobile: isMobileDevice(),
        };
        initGame(opts);

        // Title fade out after 20 seconds
        setTimeout(() => {
            const header = document.getElementById('page-header');
            if (header) {
                header.classList.add('fade-out');
            }
        }, 2000);
    })
</script>
</body>
</html>
{{ end }}

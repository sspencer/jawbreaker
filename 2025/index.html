<!DOCTYPE html>
<html lang="en">
<head>
    <title>Jawbreaker</title>
    <meta charset="UTF-8"/>
    <meta http-equiv=Content-Type content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Jawbreaker Game, also called Same Game">
    <meta name="keywords" content="jawbreaker, same game, online games, free games">
    <meta name="rating" content="Safe For Kids">
    <link rel="icon" href="static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="static/style.css">
    <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.0-beta.11/bundles/datastar.js"></script>
</head>
<body>
<main>
    <div class="container">
        <div id="game-container" data-signals="{{signals}}">
            {{game}}
            <div class="game-over-overlay" data-class="{'visible': $gameOver}">
                <div class="game-over-content">
                    <h2>Game Over!</h2>
                    <p>You scored <span data-text="$currentScore">0</span> points</p>
                    <button class="new-game-btn" data-on-click="@post('new')">New Game</button>
                </div>
            </div>
        </div>
        <div class="score-board">
            <div class="score-table">
                <div class="table-header">
                    <div>Current</div>
                    <div>Last</div>
                    <div>Best</div>
                </div>
                <div class="table-row">
                    <div id="current-score" data-text="$currentScore">0</div>
                    <div id="last-score" data-text="$lastScore">0</div>
                    <div id="best-score" data-text="$bestScore">0</div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
